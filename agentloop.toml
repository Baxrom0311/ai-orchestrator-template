[project]
path = "D:/Projects/TMS"
brief_file = "PROJECT_BRIEF.md"
test_command = "php artisan route:list --json"
logs_dir = ".agentloop/runs"
exclude_dirs = ["node_modules", "vendor", ".git", "storage", "public/build", "orchestrator/.git"]
snapshot_exclude = ["\\.git/", "\\.agentloop/", "node_modules/", "vendor/", "storage/logs/", "public/build/", "\\.idea/"]

[[project.tests]]
name = "routes"
command = "php artisan route:list --json"
cwd = "D:/Projects/TMS"
timeout_sec = 30

[[project.tests]]
name = "phpunit"
command = "php artisan test --no-interaction"
cwd = "D:/Projects/TMS"
timeout_sec = 180

[[project.tests]]
name = "playwright_dark"
command = "python orchestrator/tests/screenshot_test.py --theme dark"
cwd = "D:/Projects/TMS"
timeout_sec = 60

[[project.tests]]
name = "playwright_light"
command = "python orchestrator/tests/screenshot_test.py --theme light"
cwd = "D:/Projects/TMS"
timeout_sec = 60

[loop]
plan_cycles = 3
review_cycles = 4
build_iterations = 20
no_change_limit = 4
sleep_between_rounds_sec = 0
max_total_builds = 100
max_discovery_rounds = 5
parallel_review = true
max_parallel_builders = 5

[retry]
max_attempts = 5
backoff_base = 2
backoff_max = 60
jitter = true

[budget]
max_cost_usd = 0
warn_at_pct = 80
cost_per_build_usd = 0.15
cost_per_review_usd = 0.05
cost_per_plan_usd = 0.10

[agents.planner]
command = "kiro-cli"
agent = "ai-planner"
timeout_sec = 3600
trust_all_tools = true

[agents.builder]
command = "kiro-cli"
agent = "ai-builder"
timeout_sec = 14400
trust_all_tools = true

[agents.reviewer]
command = "kiro-cli"
agent = "ai-reviewer"
timeout_sec = 3600
trust_all_tools = true

[kiro]
enabled = true
command = "kiro-cli"
agent = "ai-planner"
timeout_sec = 3600
resume = false
trust_tools = ""
trust_all_tools = true
require_mcp_startup = false

[kiro_builder]
enabled = true
command = "kiro-cli"
agent = "ai-builder"
timeout_sec = 14400
trust_tools = "read,write,grep,shell"
trust_all_tools = true

[telegram]
enabled = true
bot_token = ""
chat_id = ""

[git]
auto_push = false
branch = "bugfix/tms-full-fixes"
commit_message = ""
